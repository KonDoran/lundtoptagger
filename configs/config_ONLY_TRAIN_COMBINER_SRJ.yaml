# ============================================================
# Data
# ============================================================
data:
  root_dir: "/path/to/root/files_or_single_file"
  root_pattern: "*.root"
  tree_name: "FlatSubstructureJetTree"
  label_branch: "labels"
  score_branches:
    - "score_model_1"
    - "score_model_2"


# ============================================================
# Model
# ============================================================
model:
  name: "Combiner"


# ============================================================
# Training
# ============================================================
training:
  n_epochs: 50
  batch_size: 4096
  learning_rate: 0.001
  validation_fraction: 0.1


# ============================================================
# Output
# ============================================================
output:
  path_to_save: "/path/to/save/combiner_checkpoints"
  checkpoint_prefix: "Combiner"
  save_every_epoch: true
  val_loss_filename: "validation_losses.txt"


# ============================================================
# Computing resources
# ============================================================
gpu: null
num_workers: 4
seed: 42
