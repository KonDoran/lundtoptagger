# ============================================================
# Data and output paths
# ============================================================
data:
  # Single pattern (most common)
  paths_to_test_file_root: "/path/to/input/root/files/*.root"
  paths_to_test_file_graphs: "/path/to/input/graph/files/*.pt"

  # Example with multiple input patterns/files:
  # paths_to_test_file_root:
  #   - "/path/to/input/root/files/partA/*.root"
  #   - "/path/to/input/root/files/partB/*.root"
  # paths_to_test_file_graphs:
  #   - "/path/to/input/graph/files/partA/*.pt"
  #   - "/path/to/input/graph/files/partB/*.pt"

  path_to_outdir: "/path/to/output/combined_scores/{sample}/"

  output_suffix: "_score_Combined"
  sample: "sample_name"
  kT_cut: null
  tree_name: "FlatSubstructureJetTree"


# ============================================================
# Model evaluation settings
# ============================================================
test:
  lundnet_model:
    tag: "LundNet"
    arch: "LundNet"
    ckpt: "/path/to/lundnet_checkpoint.pt"

  combiner_model:
    tag: "Combined"
    ckpt: "/path/to/combiner_checkpoint.pt"

  # parT score branch is fixed in script as: parT_score

  # ROOT branch names are generated from tags, like test_make_scores_SRJ.py
  scores_branch_name: "fjet_{tag}_score"

  batch_size: 2048
